# Shared definitions for the test config.
thresholds:
  battery_soc: {warning_low: 10, caution_low: 25}

conditions:
  # The grid is lost when its feed has no data, or the transfer switch has
  # opened to island the house.
  grid_lost:
    any:
      - {entity: sensor.grid_power, unavailable: true}
      - {entity: binary_sensor.grid_connected, eq: off}

# Connection styles: relative weight and casing (hollow pipe, the default).
# Color and pattern always come from status. Variants are keyed by theme name.
line_styles:
  feeder: {weight: 1}
  bus: {weight: 1.5, themes: {mirror: {weight: 1.25}}}
  signal: {weight: 0.5, casing: false}
