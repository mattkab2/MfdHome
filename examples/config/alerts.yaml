# Systems (one annunciator tile each) and the alerts grouped under them.
# Cautions and warnings latch until acknowledged; advisories clear on their own.
systems:
  GRID: {label: GRID}
  BATT: {label: BATT}
  WATER: {label: WATER}
  LEAK: {label: LEAK}
  HVAC: {label: HVAC}
  NET: {label: NET}
  SEC: {label: SEC}
  GAS: {label: GAS}
  FIRE: {label: FIRE}
  WX: {label: WX}

# State changes worth seeing beside the alerts in the log (not alerts
# themselves): arming and disarming, the main water shutoff.
log:
  - {entity: alarm_control_panel.house, label: ALARM PANEL, system: SEC}
  - {entity: valve.main_water, label: MAIN WATER, system: WATER}

alerts:
  - id: grid_lost
    severity: warning
    system: GRID
    message: GRID POWER LOST
    when: [{use: grid_lost}]
  - id: grid_exporting
    severity: advisory
    system: GRID
    message: EXPORTING TO GRID
    when: [{entity: sensor.grid_power, lt: -1000}]

  - id: battery_critical
    severity: warning
    system: BATT
    message: BATTERY CRITICAL
    when: [{entity: sensor.battery_soc, le: 10}]
  - id: battery_low
    severity: caution
    system: BATT
    message: BATTERY LOW
    when: [{entity: sensor.battery_soc, le: 25}]

  - id: water_shutoff_closed
    severity: caution
    system: WATER
    message: MAIN WATER SHUT OFF
    when: [{entity: valve.main_water, eq: closed}]
  - id: water_pressure_low
    severity: caution
    system: WATER
    message: WATER PRESSURE LOW
    for: 2m
    when: [{entity: sensor.water_pressure, lt: 30}]
  - id: water_pressure_high
    severity: caution
    system: WATER
    message: WATER PRESSURE HIGH
    for: 2m
    when: [{entity: sensor.water_pressure, gt: 80}]
  # Water running for half an hour with irrigation off: a hidden leak, or a
  # tap left on.
  - id: continuous_flow
    severity: caution
    system: WATER
    message: CONTINUOUS WATER FLOW
    for: 30m
    when:
      - {entity: sensor.water_flow, gt: 0.1}
      - {entity: valve.irrigation, ne: open}
  - id: water_heater_cold
    severity: caution
    system: WATER
    message: WATER HEATER NOT HEATING
    for: 1h
    when: [{entity: water_heater.tank, attribute: current_temperature, lt: 100}]
  - id: irrigation_running
    severity: advisory
    system: WATER
    message: IRRIGATION RUNNING
    when: [{entity: valve.irrigation, eq: open}]

  - id: leak_detected
    severity: warning
    system: LEAK
    message: LEAK DETECTED
    any:
      - {entity: binary_sensor.leak_kitchen, eq: on}
      - {entity: binary_sensor.leak_basement, eq: on}
      - {entity: binary_sensor.leak_water_heater, eq: on}
  # A dead leak sensor protects nothing: a caution, not just gray.
  - id: leak_sensor_offline
    severity: caution
    system: LEAK
    message: LEAK SENSOR OFFLINE
    for: 10m
    any:
      - {entity: binary_sensor.leak_kitchen, unavailable: true}
      - {entity: binary_sensor.leak_basement, unavailable: true}
      - {entity: binary_sensor.leak_water_heater, unavailable: true}

  - id: gas_detected
    severity: warning
    life_safety: true
    system: GAS
    message: GAS DETECTED
    when: [{entity: binary_sensor.gas_leak, eq: on}]
  - id: co_detected
    severity: warning
    life_safety: true
    system: GAS
    message: CARBON MONOXIDE
    when: [{entity: binary_sensor.co_detector, eq: on}]
  - id: gas_detector_offline
    severity: caution
    system: GAS
    message: GAS DETECTOR OFFLINE
    for: 10m
    any:
      - {entity: binary_sensor.gas_leak, unavailable: true}
      - {entity: binary_sensor.co_detector, unavailable: true}

  - id: hvac_fault
    severity: caution
    system: HVAC
    message: HVAC FAULT
    when: [{entity: binary_sensor.hvac_fault, eq: on}]
  # A system more than 3 degrees off its setpoint for half an hour.
  - id: main_not_heating
    severity: caution
    system: HVAC
    message: MAIN SYSTEM NOT HEATING
    for: 30m
    when:
      - entity: climate.main
        attribute: current_temperature
        lt: {entity: climate.main, attribute: temperature, offset: -3}
      - {entity: climate.main, eq: heat}
  - id: main_not_cooling
    severity: caution
    system: HVAC
    message: MAIN SYSTEM NOT COOLING
    for: 30m
    when:
      - entity: climate.main
        attribute: current_temperature
        gt: {entity: climate.main, attribute: temperature, offset: 3}
      - {entity: climate.main, eq: cool}
  - id: upstairs_not_cooling
    severity: caution
    system: HVAC
    message: UPSTAIRS SYSTEM NOT COOLING
    for: 30m
    when:
      - entity: climate.upstairs
        attribute: current_temperature
        gt: {entity: climate.upstairs, attribute: temperature, offset: 3}
      - {entity: climate.upstairs, eq: cool}
  # Pipes freeze: the house itself is getting cold.
  - id: freeze_risk
    severity: warning
    system: HVAC
    message: HOUSE BELOW 50°
    for: 15m
    when: [{entity: climate.main, attribute: current_temperature, lt: 50}]
  - id: main_thermostat_offline
    severity: caution
    system: HVAC
    message: MAIN THERMOSTAT OFFLINE
    for: 10m
    when: [{entity: climate.main, unavailable: true}]
  - id: upstairs_thermostat_offline
    severity: caution
    system: HVAC
    message: UPSTAIRS THERMOSTAT OFFLINE
    for: 10m
    when: [{entity: climate.upstairs, unavailable: true}]
  - id: furnace_filter_overdue
    severity: advisory
    system: HVAC
    message: REPLACE FURNACE FILTER
    when: [{entity: sensor.furnace_filter_life, lt: 10}]
  - id: upstairs_filter_overdue
    severity: advisory
    system: HVAC
    message: REPLACE UPSTAIRS FILTER
    when: [{entity: sensor.upstairs_filter_life, lt: 10}]
  - id: humidity_out_of_range
    severity: advisory
    system: HVAC
    message: INDOOR HUMIDITY OUT OF RANGE
    for: 1h
    any:
      - {entity: climate.main, attribute: current_humidity, lt: 25}
      - {entity: climate.main, attribute: current_humidity, gt: 60}

  - id: wan_down
    severity: warning
    system: NET
    message: INTERNET DOWN
    when: [{entity: binary_sensor.wan_online, eq: off}]

  - id: alarm_triggered
    severity: warning
    life_safety: true
    system: SEC
    message: ALARM TRIGGERED
    when: [{entity: alarm_control_panel.house, eq: triggered}]
  # Armed with a door or window open: arming over an open zone, or a zone
  # that opened without triggering (bypassed).
  - id: armed_zone_open
    severity: caution
    system: SEC
    message: ARMED WITH A ZONE OPEN
    when: [{use: armed}, {use: zone_open}]
  - id: zone_trouble
    severity: caution
    system: SEC
    message: SECURITY ZONE OFFLINE
    for: 10m
    any:
      - {entity: binary_sensor.front_door, unavailable: true}
      - {entity: binary_sensor.back_door, unavailable: true}
      - {entity: binary_sensor.living_window, unavailable: true}
      - {entity: binary_sensor.kitchen_window, unavailable: true}
      - {entity: binary_sensor.bed_1_window, unavailable: true}
      - {entity: binary_sensor.bed_2_window, unavailable: true}
      - {entity: binary_sensor.living_motion, unavailable: true}
      - {entity: binary_sensor.hall_motion, unavailable: true}
      - {entity: binary_sensor.living_glass_break, unavailable: true}
  - id: panel_offline
    severity: caution
    system: SEC
    message: ALARM PANEL OFFLINE
    for: 5m
    when: [{entity: alarm_control_panel.house, unavailable: true}]
  - id: front_door_open
    severity: advisory
    system: SEC
    message: FRONT DOOR LEFT OPEN
    for: 10m
    when: [{entity: binary_sensor.front_door, eq: on}]

  - id: smoke_detected
    severity: warning
    life_safety: true
    system: FIRE
    message: SMOKE DETECTED
    when: [{entity: binary_sensor.hall_smoke, eq: on}]
  - id: smoke_detector_offline
    severity: caution
    system: FIRE
    message: SMOKE DETECTOR OFFLINE
    for: 10m
    when: [{entity: binary_sensor.hall_smoke, unavailable: true}]

  - id: high_wind
    severity: caution
    system: WX
    message: HIGH WIND
    when: [{entity: sensor.wind_speed, gt: 60}]
