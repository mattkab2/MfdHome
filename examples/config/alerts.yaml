# Systems (one annunciator tile each) and the alerts grouped under them.
# Cautions and warnings latch until acknowledged; advisories clear on their own.
systems:
  GRID: {label: GRID}
  BATT: {label: BATT}
  WATER: {label: WATER}
  LEAK: {label: LEAK}
  HVAC: {label: HVAC}
  NET: {label: NET}
  SEC: {label: SEC}
  WX: {label: WX}

alerts:
  - id: grid_lost
    severity: warning
    system: GRID
    message: GRID POWER LOST
    when: [{use: grid_lost}]
  - id: grid_exporting
    severity: advisory
    system: GRID
    message: EXPORTING TO GRID
    when: [{entity: sensor.grid_power, lt: -1000}]

  - id: battery_critical
    severity: warning
    system: BATT
    message: BATTERY CRITICAL
    when: [{entity: sensor.battery_soc, le: 10}]
  - id: battery_low
    severity: caution
    system: BATT
    message: BATTERY LOW
    when: [{entity: sensor.battery_soc, le: 25}]

  - id: water_shutoff_closed
    severity: caution
    system: WATER
    message: MAIN WATER SHUT OFF
    when: [{entity: valve.main_water, eq: closed}]
  - id: water_pressure_low
    severity: caution
    system: WATER
    message: WATER PRESSURE LOW
    when: [{entity: sensor.water_pressure, lt: 30}]

  - id: leak_detected
    severity: warning
    system: LEAK
    message: LEAK DETECTED
    any:
      - {entity: binary_sensor.leak_kitchen, eq: on}
      - {entity: binary_sensor.leak_basement, eq: on}

  - id: hvac_fault
    severity: caution
    system: HVAC
    message: HVAC FAULT
    when: [{entity: binary_sensor.hvac_fault, eq: on}]

  - id: wan_down
    severity: warning
    system: NET
    message: INTERNET DOWN
    when: [{entity: binary_sensor.wan_online, eq: off}]

  - id: alarm_triggered
    severity: warning
    system: SEC
    message: ALARM TRIGGERED
    when: [{entity: alarm_control_panel.house, eq: triggered}]
  - id: front_door_open
    severity: advisory
    system: SEC
    message: FRONT DOOR OPEN
    when: [{entity: binary_sensor.front_door, eq: on}]

  - id: high_wind
    severity: caution
    system: WX
    message: HIGH WIND
    when: [{entity: sensor.wind_speed, gt: 60}]
