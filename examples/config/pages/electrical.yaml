# Minimal Electrical page: solar and battery feed a bus; the bus feeds loads
# and ties to the grid through the main breaker. Generic entity ids only.
page: electrical
title: Electrical
canvas: {width: 1000, height: 600}

elements:
  - {id: title, type: text, at: [80, 40], text: ELEC}

  # The bus: everything meets here (a junction dot is drawn automatically).
  - {id: bus, type: node, at: [500, 300]}

  - id: solar
    type: line
    style: feeder
    from: [500, 80]
    to: bus
    bind: {power: sensor.solar_power}
    flow: true
    name: {text: SOLAR, along: 0, anchor: top}
    readouts: [{value: power, format: power, abs: true}]

  - id: battery
    type: battery
    at: [200, 300]
    name: BATT
    bind:
      level: sensor.battery_soc
      power: sensor.battery_power
    status: {thresholds: battery_soc}
    readouts:
      - {value: level, format: percent}
      - {value: power, format: power}

  # Battery power: positive = charging (bus -> battery), negative = discharging.
  - id: battery_feed
    type: line
    style: feeder
    from: bus
    to: battery.right
    bind: {power: sensor.battery_power}
    flow: true
    readouts: [{value: power, format: power, abs: true}]

  - {id: bus_tie, type: line, style: bus, from: bus, to: main_breaker.in}

  - id: main_breaker
    type: breaker
    at: [650, 300]
    bind: {state: switch.main_breaker}
    status:
      map: {on: normal, closed: normal}
      default: caution
      rules:
        # Open breaker with the grid gone means the house is islanded.
        - level: warning
          any:
            - all:
                - {channel: state, eq: off}
                - {use: grid_lost}
            - {channel: state, eq: tripped}

  # Positive grid power = import (grid -> house); negative = export.
  - id: grid
    type: line
    style: feeder
    from: [880, 300]
    to: main_breaker.out
    bind: {power: sensor.grid_power}
    flow: true
    name: {text: GRID, along: 0, anchor: right}
    readouts: [{value: power, format: power, abs: true}]

  - id: loads
    type: line
    style: feeder
    from: bus
    to: [500, 500]
    bind: {power: sensor.load_power}
    flow: true
    name: {text: LOADS, along: 1, anchor: bottom}
    readouts: [{value: power, format: power, abs: true}]
