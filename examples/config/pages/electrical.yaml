# Electrical page: whole-home backup. The grid feeds the house through the
# main breaker and a grid-isolating transfer switch (ATS), which share the
# backup gateway's cabinet. Solar, battery and the load panel share the
# backup bus on the house side of the ATS, so they keep running when the ATS
# opens (islanded). Generic entity ids only.
page: electrical
title: Electrical
canvas: {width: 1000, height: 600}

elements:
  - {id: title, type: text, at: [80, 40], text: ELEC}

  # --- utility side --------------------------------------------------------
  # Grid power: positive = import (grid -> house), negative = export.
  - id: grid
    type: line
    from: [70, 260]
    to: main_breaker.in
    bind: {rate: sensor.grid_power}
    flow: {threshold: 10}             # W: ignore sensor noise near zero
    status: {systems: [GRID]}       # hatched red while the grid is lost
    name: {text: GRID, along: 0, anchor: left}
    readouts: [{value: rate, format: power, abs: true, along: 0.4}]

  - id: main_breaker
    type: breaker
    at: [200, 260]
    name: MAIN
    bind: {state: switch.main_breaker}
    status:
      map: {on: normal, closed: normal}
      default: caution

  - id: grid_link
    type: line
    from: main_breaker.out
    to: ats.grid
    bind: {rate: sensor.grid_power}
    flow: {threshold: 10}             # W: ignore sensor noise near zero
    status: {systems: [GRID]}

  - id: ats
    type: transfer_switch
    at: [330, 260]
    name: ATS
    bind: {state: binary_sensor.grid_connected}
    status:
      map: {on: normal}             # connected to the grid
      default: caution              # open: islanded, running on backup

  # The main breaker and the ATS share one cabinet (a backup gateway). The
  # frame takes their worst status; lines still connect to each of them.
  - id: gateway
    type: enclosure
    contains: [main_breaker, ats]
    padding: 28                       # room for MAIN and ATS inside the frame
    name: GATEWAY

  # --- backup (house) side -------------------------------------------------
  - id: backup_feed
    type: line
    from: ats.load
    to: bus
    bind: {rate: sensor.grid_power}
    flow: {threshold: 10}             # W: ignore sensor noise near zero

  # The backup bus: everything on the house side meets here.
  - {id: bus, type: node, at: [640, 260]}

  # Solar array: panels connect only through the group; the group's derived
  # 'power' (sum of its panels) drives the feeder.
  - id: array
    type: group
    at: [300, 40]
    layout: {grid: {columns: 6, gap: 8}}
    name: {text: SOLAR, anchor: left}
    channels:
      power: {sum: power}
      offline: {count: unavailable}
      online: {count: normal}
    status:
      # Caution when 2+ panels drop out while others still report; if nothing
      # reports at all, the group shows as unavailable instead.
      rules:
        - level: caution
          when: [{channel: offline, ge: 2}, {channel: online, ge: 1}]
    item_defaults: {type: solar_panel}
    items:
      - {id: p1, bind: {power: sensor.pv_p1_power}}
      - {id: p2, bind: {power: sensor.pv_p2_power}}
      - {id: p3, bind: {power: sensor.pv_p3_power}}
      - {id: p4, bind: {power: sensor.pv_p4_power}}
      - {id: p5, bind: {power: sensor.pv_p5_power}}
      - {id: p6, bind: {power: sensor.pv_p6_power}}

  - id: solar
    type: line
    from: array.right
    to: bus
    bind: {rate: array.power}
    flow: {threshold: 10}             # W: ignore sensor noise near zero
    readouts: [{value: rate, format: power, abs: true, along: 0.6}]

  - id: battery
    type: battery
    at: [860, 420]
    name: {text: BATT, anchor: right}
    bind:
      level: sensor.battery_soc
      power: sensor.battery_power
    status: {thresholds: battery_soc}
    readouts:
      - {value: level, format: percent}
      - {value: power, format: power}

  # Battery power: positive = charging (bus -> battery), negative = discharging.
  - id: battery_feed
    type: line
    from: bus
    to: battery.top
    bind: {rate: sensor.battery_power}
    status: {alerts: [battery_low, battery_critical]}
    flow: {threshold: 10}             # W: ignore sensor noise near zero
    readouts: [{value: rate, format: power, abs: true}]

  - id: loads
    type: load_panel
    at: [640, 450]
    name: {text: LOADS, anchor: right}
    bind: {power: sensor.load_power}

  - id: load_feed
    type: line
    from: bus
    to: loads.top
    bind: {rate: sensor.load_power}
    flow: {threshold: 10}             # W: ignore sensor noise near zero
    readouts: [{value: rate, format: power, abs: true}]
