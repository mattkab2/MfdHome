# Physical displays. Each shows one page at a time, chosen by the viewer from
# 'pages' (which always includes 'home'). A display without 'pages' (like the
# mirror) is fixed to its home page.
displays:
  workshop:
    theme: lcd
    size: [1280, 800]
    home: status
    pages: [status, electrical, water, hvac, security, log]
  hallway:
    theme: mirror
    size: [1920, 1080]
    home: electrical
  main_floor:
    theme: eink_mono
    size: [800, 480]
    home: status
    pages: [status, electrical, water, hvac, security, log]
    panel: mono
