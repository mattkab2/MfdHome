[project]
name = "mfdhome"
version = "0.1.0"
description = ""
authors = [
    {name = "Matt Kabelitz",email = "mattkab2@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ruamel-yaml (>=0.19.1,<0.20.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)"
]

[project.scripts]
mfdhome = "mfdhome.cli:main"

[tool.poetry]
packages = [{include = "mfdhome", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "syrupy (>=6.1.1,<7.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest-aiohttp (>=1.1.1,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
